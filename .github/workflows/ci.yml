name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # As dependências são só de desenvolvimento (verificação de tipos); a aplicação e os testes não precisam delas.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
